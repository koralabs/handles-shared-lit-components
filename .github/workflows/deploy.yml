name: handles-shared-lit-components
on:
    push:
        branches:
            - master
        paths-ignore:
            - '.local-test-evidence.json'
    workflow_dispatch:
permissions:
    contents: read
    id-token: write   # OIDC trusted publishing to npm
jobs:
    deploy:
        name: Deploying from ${{ github.ref_name }}
        environment: mainnet
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            - name: Verify local test evidence (tests run locally, never in Actions)
              run: |
                c=$(jq -er 'select(.result == "pass") | .commit' .local-test-evidence.json) && git diff --quiet "$c" HEAD -- . ':!.local-test-evidence.json' || { echo "::error::no valid local test evidence for this commit: run adahandle-deployments/common/test-evidence.sh record locally and push the evidence commit"; exit 1; }

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 26
                  registry-url: https://registry.npmjs.org
                  scope: '@koralabs'

            - name: Install deps
              run: npm install --no-audit --no-fund

            - name: Build
              run: npm run build

            # npm publish via OIDC trusted publishing (replaces the retired
            # adahandle-deployments AWS pipeline). tsc emits to lib/; publish from
            # there with package.json copied in (main=index.js -> lib/index.js).
            # Every master push runs this, but only a version bump releases: an
            # already-published version is skipped instead of failing the deploy.
            - name: Publish to npm
              run: |
                  cp package.json ./lib/package.json && cd ./lib
                  VERSION="$(jq -r .name package.json)@$(jq -r .version package.json)"
                  if [ -n "$(npm view "$VERSION" version 2>/dev/null)" ]; then
                      echo "$VERSION is already on npm; bump package.json to release."
                  else
                      npm publish --provenance --access public
                  fi
